<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阶梯之间：驼铃与马帮</title>
  <style>
    :root{
      --bg:#efe5cf;
      --bg-deep:#e2d4b4;
      --paper:rgba(255,251,242,0.84);
      --paper-strong:rgba(255,248,235,0.97);
      --ink:#30261d;
      --ink-soft:#5b4a39;
      --line:rgba(87,68,48,.18);
      --red:#8f2f26;
      --gold:#c49a47;
      --green:#4d6b54;
      --blue:#6b8391;
      --shadow:0 10px 28px rgba(70,52,35,.14);
      --shadow-soft:0 6px 18px rgba(70,52,35,.08);
      --radius:22px;
      --radius-sm:14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--ink);
      font-family:"Source Han Sans CN","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
      background:
        radial-gradient(circle at 10% 12%, rgba(72,60,43,.08), transparent 18%),
        radial-gradient(circle at 87% 18%, rgba(72,60,43,.08), transparent 16%),
        radial-gradient(circle at 20% 86%, rgba(72,60,43,.05), transparent 18%),
        linear-gradient(135deg, #f6efdf 0%, var(--bg) 42%, var(--bg-deep) 100%);
      overflow-x:hidden;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      pointer-events:none;
      z-index:0;
      filter:blur(2px);
      opacity:.18;
    }

    body::before{
      width:380px;height:380px;left:-80px;top:-60px;
      background:radial-gradient(circle, rgba(75,59,41,.3) 0%, rgba(75,59,41,.12) 28%, transparent 62%);
    }

    body::after{
      width:420px;height:420px;right:-120px;bottom:-90px;
      background:radial-gradient(circle, rgba(75,59,41,.28) 0%, rgba(75,59,41,.1) 26%, transparent 62%);
    }

    .container{
      position:relative;
      z-index:1;
      width:min(1480px, calc(100% - 28px));
      margin:18px auto 28px;
    }

    .hidden{display:none !important}

    .card{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(4px);
    }

    .subcard{
      background:var(--paper-strong);
      border:1px solid rgba(87,68,48,.12);
      border-radius:var(--radius-sm);
      box-shadow:var(--shadow-soft);
    }

    .seal{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:56px;height:56px;
      background:linear-gradient(180deg, #a73a2f, #81271f);
      color:#fff6e6;
      border-radius:16px;
      font-weight:800;
      letter-spacing:2px;
      box-shadow:0 8px 16px rgba(130,39,31,.22);
      flex:0 0 auto;
    }

    .ink-title{
      margin:0;
      font-size:clamp(1.85rem, 3.2vw, 3.1rem);
      letter-spacing:.06em;
      line-height:1.1;
    }

    .muted{color:var(--ink-soft)}
    .small{font-size:.92rem}
    .tiny{font-size:.82rem}

    button{
      border:none;
      cursor:pointer;
      font:inherit;
      transition:.18s ease;
    }

    .btn{
      padding:12px 18px;
      border-radius:999px;
      color:#fff6ea;
      background:linear-gradient(180deg, #8f4034, #733028);
      box-shadow:0 8px 16px rgba(110,44,34,.18);
    }

    .btn:hover{transform:translateY(-1px)}

    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }

    .btn-ghost{
      padding:11px 16px;
      border-radius:999px;
      background:rgba(255,252,245,.75);
      color:var(--ink);
      border:1px solid rgba(87,68,48,.16);
    }

    .btn-soft{
      padding:10px 14px;
      border-radius:12px;
      background:#f7f0e4;
      color:var(--ink);
      border:1px solid rgba(87,68,48,.15);
    }

    .btn-choice{
      width:100%;
      text-align:left;
      padding:16px 16px;
      border-radius:16px;
      background:linear-gradient(180deg, #fffaf0, #f5ecd9);
      border:1px solid rgba(87,68,48,.14);
      color:var(--ink);
      box-shadow:var(--shadow-soft);
    }

    .btn-choice:hover{
      transform:translateY(-1px);
      border-color:rgba(143,47,38,.28);
    }

    .btn-choice strong{
      display:block;
      margin-bottom:6px;
      font-size:1rem;
    }

    .start-screen{
      min-height:calc(100vh - 52px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .start-wrap{
      width:100%;
      display:grid;
      gap:18px;
    }

    .hero{
      padding:24px 26px;
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:18px;
    }

    .hero-main{
      display:flex;
      gap:16px;
      align-items:flex-start;
    }

    .hero-copy p{
      margin:8px 0 0;
      line-height:1.8;
      color:var(--ink-soft);
    }

    .hero-note{
      padding:18px 20px;
      display:grid;
      gap:10px;
      align-content:center;
      background:linear-gradient(180deg, rgba(255,250,242,.95), rgba(247,237,220,.92));
    }

    .hero-note h3{
      margin:0;
      font-size:1.1rem;
    }

    .hero-note ul{
      margin:0;
      padding-left:1.15rem;
      line-height:1.85;
      color:var(--ink-soft);
    }

    .role-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:18px;
    }

    .role-card{
      overflow:hidden;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
    }

    .role-art{padding:14px 14px 0}
    .role-content{
      padding:0 16px 16px;
      display:grid;
      gap:12px;
    }

    .role-tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:.88rem;
      background:#f8f1e1;
      border:1px solid rgba(87,68,48,.12);
      width:max-content;
    }

    .role-card h3{
      margin:0;
      font-size:1.16rem;
      line-height:1.4;
    }

    .role-card p{
      margin:0;
      color:var(--ink-soft);
      line-height:1.75;
      font-size:.95rem;
    }

    .tag-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      padding:4px 8px;
      border-radius:999px;
      font-size:.78rem;
      line-height:1;
      border:1px solid rgba(87,68,48,.12);
      background:#fbf6ea;
    }

    .tag.local-tag{background:rgba(77,107,84,.12); color:#35513e}
    .tag.need-tag{background:rgba(143,47,38,.11); color:#7e2c23}
    .tag.route-tag{background:rgba(107,131,145,.12); color:#405766}
    .tag.warn-tag{background:rgba(180,147,73,.15); color:#77561e}
    .tag.done-tag{background:rgba(77,107,84,.15); color:#2f533a}

    .game-screen{
      display:grid;
      gap:18px;
    }

    .topbar{
      padding:18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .topbar-left{
      display:flex;
      gap:14px;
      align-items:center;
    }

    .topbar h1{
      margin:0;
      font-size:1.7rem;
      letter-spacing:.08em;
    }

    .topbar p{
      margin:6px 0 0;
      color:var(--ink-soft);
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:18px;
    }

    .scene-card{
      overflow:hidden;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    .scene-art{padding:16px 16px 0}
    .scene-body{
      padding:16px 18px 20px;
      display:grid;
      gap:12px;
    }

    .scene-body h2{
      margin:0;
      font-size:1.36rem;
    }

    .scene-body p{
      margin:0;
      line-height:1.85;
      color:var(--ink-soft);
    }

    .status-card{
      padding:18px;
      display:grid;
      gap:14px;
    }

    .metric-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:12px;
    }

    .metric{
      padding:14px 14px;
      border-radius:18px;
      background:rgba(255,251,242,.88);
      border:1px solid rgba(87,68,48,.12);
      box-shadow:var(--shadow-soft);
    }

    .metric .label{
      font-size:.82rem;
      color:var(--ink-soft);
      margin-bottom:6px;
    }

    .metric .value{
      font-size:1.06rem;
      font-weight:800;
      line-height:1.35;
    }

    .meter-wrap{
      display:grid;
      gap:10px;
      padding:16px;
    }

    .meter-title{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-weight:700;
    }

    .meter{
      height:16px;
      border-radius:999px;
      background:#e7dcc2;
      overflow:hidden;
      border:1px solid rgba(87,68,48,.1);
    }

    .meter > span{
      display:block;
      height:100%;
      width:0%;
      border-radius:999px;
      transition:width .25s ease;
    }

    .meter.integration > span{
      background:linear-gradient(90deg, #8b2f25, #c49a47 55%, #5d815e);
    }

    .meter.time > span{
      background:linear-gradient(90deg, #9a3c2d, #d49c49 62%, #d7c7a1);
    }

    .status-strip{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:12px;
    }

    .strip{
      padding:14px;
      border-radius:16px;
      background:rgba(255,248,237,.9);
      border:1px solid rgba(87,68,48,.12);
      line-height:1.7;
      color:var(--ink-soft);
    }

    .strip strong{color:var(--ink)}

    .risk-high{
      color:var(--red);
      font-weight:800;
    }

    .risk-mid{
      color:#7f5a20;
      font-weight:800;
    }

    .main-grid{
      display:grid;
      grid-template-columns:1.04fr .96fr;
      gap:18px;
      align-items:start;
    }

    .left-stack,.right-stack{
      display:grid;
      gap:18px;
    }

    .quest-card{
      padding:18px;
      display:grid;
      gap:14px;
    }

    .quest-card h3,
    .panel-card h3,
    .pack-card h3,
    .log-card h3{
      margin:0;
      font-size:1.12rem;
    }

    .quest-body{
      line-height:1.9;
      color:var(--ink-soft);
    }

    .chapter-box{
      padding:14px;
      border-radius:18px;
      border:1px solid rgba(87,68,48,.12);
      background:rgba(255,250,242,.92);
      display:grid;
      gap:10px;
    }

    .chapter-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .chapter-head h4{
      margin:0;
      font-size:1.04rem;
    }

    .objective-list{
      display:grid;
      gap:8px;
    }

    .objective-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(87,68,48,.1);
      background:rgba(255,248,239,.9);
      font-size:.92rem;
      line-height:1.7;
    }

    .objective-item.done{
      background:rgba(243,251,244,.96);
      border-color:rgba(77,107,84,.18);
    }

    .panel-card{
      padding:18px;
      display:grid;
      gap:16px;
    }

    .tabbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .tab-btn{
      padding:11px 16px;
      border-radius:999px;
      background:#f7f0e4;
      color:var(--ink);
      border:1px solid rgba(87,68,48,.12);
    }

    .tab-btn.active{
      background:linear-gradient(180deg, #8f4034, #743129);
      color:#fff8ea;
      box-shadow:0 8px 18px rgba(110,44,34,.2);
    }

    .goods-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(182px, 1fr));
      gap:14px;
    }

    .goods-card{
      padding:14px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,251,244,.98), rgba(248,239,225,.96));
      border:1px solid rgba(87,68,48,.12);
      display:grid;
      gap:10px;
      box-shadow:var(--shadow-soft);
    }

    .goods-card.local{
      box-shadow: inset 0 0 0 1px rgba(77,107,84,.16), var(--shadow-soft);
    }

    .goods-card.needed{
      box-shadow: inset 0 0 0 1px rgba(143,47,38,.15), var(--shadow-soft);
    }

    .goods-top{
      display:grid;
      grid-template-columns:46px 1fr;
      gap:10px;
      align-items:center;
    }

    .goods-icon{
      width:46px;height:46px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.6);
      font-size:1.55rem;
      border:1px solid rgba(87,68,48,.1);
    }

    .goods-title{
      font-weight:800;
      font-size:1rem;
    }

    .goods-desc{
      color:var(--ink-soft);
      font-size:.87rem;
      line-height:1.65;
    }

    .price-row,
    .owned-row{
      display:flex;
      justify-content:space-between;
      gap:8px;
      font-size:.9rem;
    }

    .goods-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .goods-actions .btn-soft{
      padding:10px 8px;
      text-align:center;
    }

    .travel-intro,
    .culture-tip{
      line-height:1.8;
      color:var(--ink-soft);
      padding:12px 14px;
    }

    .travel-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
    }

    .travel-card{
      padding:12px;
      display:grid;
      gap:10px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,251,244,.98), rgba(248,239,225,.96));
      border:1px solid rgba(87,68,48,.12);
      box-shadow:var(--shadow-soft);
    }

    .travel-card h4{
      margin:0;
      font-size:1rem;
    }

    .travel-card p{
      margin:0;
      line-height:1.7;
      color:var(--ink-soft);
      font-size:.9rem;
    }

    .travel-meta{
      display:grid;
      gap:8px;
    }

    .culture-box{
      display:grid;
      gap:14px;
    }

    .dialogue-list{
      display:grid;
      gap:10px;
    }

    .dialogue{
      display:grid;
      grid-template-columns:58px 1fr;
      gap:10px;
      align-items:start;
    }

    .dialogue.right{
      grid-template-columns:1fr 58px;
    }

    .dialogue.right .portrait{order:2}
    .dialogue.right .speech{order:1}

    .portrait{
      width:58px;
      height:58px;
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(87,68,48,.12);
      background:#fff;
      box-shadow:var(--shadow-soft);
    }

    .speech{
      padding:12px 14px;
      border-radius:16px;
      border:1px solid rgba(87,68,48,.12);
      background:rgba(255,249,239,.96);
      line-height:1.8;
      color:var(--ink-soft);
    }

    .speaker{
      font-weight:800;
      color:var(--ink);
      margin-bottom:4px;
    }

    .pack-card{
      padding:18px;
      display:grid;
      gap:14px;
    }

    .pack-grid{
      display:grid;
      gap:10px;
      max-height:560px;
      overflow:auto;
      padding-right:2px;
    }

    .pack-item{
      display:grid;
      grid-template-columns:48px 1fr auto;
      gap:12px;
      align-items:center;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,249,239,.95);
      border:1px solid rgba(87,68,48,.12);
    }

    .pack-item .icon{
      width:48px;height:48px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.6);
      font-size:1.5rem;
      border:1px solid rgba(87,68,48,.1);
    }

    .pack-item .name{
      font-weight:800;
      margin-bottom:4px;
    }

    .pack-item .origin{
      color:var(--ink-soft);
      line-height:1.6;
      font-size:.85rem;
    }

    .pack-item .qty{
      font-weight:900;
      font-size:1.1rem;
      color:var(--red);
      min-width:44px;
      text-align:right;
    }

    .empty{
      padding:18px;
      border-radius:16px;
      border:1px dashed rgba(87,68,48,.18);
      color:var(--ink-soft);
      text-align:center;
      line-height:1.8;
      background:rgba(255,250,242,.76);
    }

    .log-card{
      padding:18px;
      display:grid;
      gap:14px;
    }

    .log-list{
      display:grid;
      gap:10px;
      max-height:520px;
      overflow:auto;
      padding-right:2px;
    }

    .log-item{
      padding:12px 14px;
      border-radius:16px;
      line-height:1.75;
      background:rgba(255,249,239,.95);
      border:1px solid rgba(87,68,48,.12);
    }

    .log-item.important{
      border-left:5px solid var(--red);
      background:rgba(255,244,239,.96);
    }

    .log-item.bonus{
      border-left:5px solid var(--green);
      background:rgba(244,251,245,.96);
    }

    .log-item.warn{
      border-left:5px solid #8a7b62;
      background:rgba(250,247,240,.96);
    }

    .scene-svg{
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
      border:1px solid rgba(87,68,48,.12);
      background:#f7f1e5;
    }

    .scene-badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .orders-grid{
      display:grid;
      gap:10px;
    }

    .order-card{
      padding:13px 14px;
      border-radius:16px;
      border:1px solid rgba(87,68,48,.12);
      background:rgba(255,249,239,.95);
      display:grid;
      gap:8px;
    }

    .order-top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:flex-start;
    }

    .order-card h4{
      margin:0;
      font-size:1rem;
    }

    .order-card p{
      margin:0;
      color:var(--ink-soft);
      line-height:1.7;
      font-size:.9rem;
    }

    .action-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .modal{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:99;
      background:rgba(32,24,18,.46);
      backdrop-filter: blur(3px);
    }

    .modal-card{
      width:min(820px, 100%);
      padding:22px;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,251,243,.98), rgba(245,235,218,.98));
      border:1px solid rgba(87,68,48,.16);
      box-shadow:0 22px 50px rgba(20,14,10,.26);
      display:grid;
      gap:16px;
    }

    .modal-head{
      display:flex;
      gap:14px;
      align-items:flex-start;
    }

    .modal-emoji{
      width:66px;height:66px;
      flex:0 0 auto;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.8rem;
      background:rgba(255,255,255,.65);
      border:1px solid rgba(87,68,48,.12);
    }

    .modal-card h2{
      margin:0 0 6px;
      font-size:1.4rem;
    }

    .modal-card p{
      margin:0;
      line-height:1.9;
      color:var(--ink-soft);
    }

    .chapter-reward{
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(87,68,48,.12);
      background:rgba(255,250,242,.92);
      line-height:1.85;
      color:var(--ink-soft);
    }

    .ending-text{
      line-height:2;
      color:var(--ink-soft);
      font-size:1rem;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:12px;
    }

    .summary-box{
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(87,68,48,.12);
      background:rgba(255,250,242,.9);
      text-align:center;
    }

    .summary-box .num{
      display:block;
      font-size:1.45rem;
      font-weight:900;
      color:var(--red);
      margin-top:6px;
    }

    @media (max-width: 1180px){
      .hero,
      .hero-grid,
      .main-grid{
        grid-template-columns:1fr;
      }
      .travel-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 980px){
      .role-grid{
        grid-template-columns:1fr;
      }
      .metric-grid,
      .status-strip,
      .summary-grid{
        grid-template-columns:repeat(2, 1fr);
      }
    }

    @media (max-width: 680px){
      .container{width:min(100% - 16px, 1480px)}
      .hero, .topbar, .scene-body, .status-card, .quest-card, .panel-card, .pack-card, .log-card{
        padding-left:14px;padding-right:14px;
      }
      .metric-grid,
      .status-strip,
      .summary-grid{
        grid-template-columns:1fr;
      }
      .goods-grid{
        grid-template-columns:1fr;
      }
      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }
      .hero-main{
        flex-direction:column;
      }
      .dialogue,
      .dialogue.right{
        grid-template-columns:48px 1fr;
      }
      .dialogue.right .portrait{order:0}
      .dialogue.right .speech{order:0}
      .portrait{width:48px;height:48px}
    }
  </style>
</head>

  <div id="eventModal" class="modal hidden"></div>
  <div id="endingModal" class="modal hidden"></div>

  <script>
    const GOODS = {
      yak:        { name: '牦牛',     icon: '🐂', base: 20, origin: 1, desc: '高寒牧区的重要牲畜，能运载也能供给。' },
      saffron:    { name: '藏红花',   icon: '🌺', base: 24, origin: 1, desc: '高原珍贵香料与药材，可归入藏药。' },
      cordyceps:  { name: '冬虫夏草', icon: '🍄', base: 30, origin: 1, desc: '高原药材，在农耕区极受看重。' },
      barley:     { name: '青稞',     icon: '🌾', base: 14, origin: 1, desc: '高原主粮，耐寒耐瘠薄。' },
      horse:      { name: '骏马',     icon: '🐎', base: 36, origin: 2, desc: '草原与山地的重要交通与战略物资。' },
      fur:        { name: '皮毛',     icon: '🧥', base: 22, origin: 2, desc: '御寒所需，在寒冷季节更受欢迎。' },
      dairy:      { name: '乳制品',   icon: '🥛', base: 16, origin: 2, desc: '牧区奶食，便于补给与交易。' },
      silver:     { name: '银饰',     icon: '💍', base: 28, origin: 2, desc: '山地手工银饰，苗族工艺尤具特色。' },
      silk:       { name: '丝绸',     icon: '🧵', base: 26, origin: 3, desc: '农耕区精美织物，是跨区域贸易热门货。' },
      porcelain:  { name: '瓷器',     icon: '🏺', base: 24, origin: 3, desc: '窑火所成，既实用也富审美价值。' },
      tea:        { name: '茶叶',     icon: '🍵', base: 20, origin: 3, desc: '平原与山地茶园所产，是高原和草原要货。' },
      iron:       { name: '铁器',     icon: '⚒️', base: 24, origin: 3, desc: '生产与防务的重要器具，是战略物资。' },
      grain:      { name: '粮食',     icon: '🍚', base: 15, origin: 3, desc: '农耕文明核心区稳定产出的基础物资。' }
    };

    const REGIONS = {
      1: {
        id: 1,
        stair: '第一阶梯',
        title: '高寒牧区',
        name: '青藏高原',
        peoples: '藏族',
        localGoods: ['yak','saffron','cordyceps','barley'],
        needs: ['iron','tea','silk']
      },
      2: {
        id: 2,
        stair: '第二阶梯',
        title: '草原游牧区与高原山地',
        name: '内蒙古草原、云贵高原、黄土高原',
        peoples: '蒙古族、回族、苗族',
        localGoods: ['horse','fur','dairy','silver'],
        needs: ['grain','silk','porcelain','iron']
      },
      3: {
        id: 3,
        stair: '第三阶梯',
        title: '农耕文明核心区',
        name: '华北平原、长江中下游平原、四川盆地',
        peoples: '汉族',
        localGoods: ['silk','porcelain','tea','iron','grain'],
        needs: ['horse','fur','saffron','cordyceps']
      }
    };

    const ROLES = [
      {
        id: 'tibetan',
        region: 1,
        title: '第一阶梯 · 藏族商队青年',
        shortTitle: '藏族商队青年',
        motto: '我生于高原，懂得山口艰险，也懂得互通有无的珍贵。',
        intro: '寒冬将至，我们需要中原的铁器来打造工具，也需要茶叶来熬制酥油茶，还盼着丝绸越过山口来到高原。我决定带上牦牛、青稞和药材，走下雪线，去寻找能够让部落更兴旺的商路。',
        money: 118,
        stamina: 8,
        startGoods: { yak: 2, barley: 3, saffron: 1, cordyceps: 1 }
      },
      {
        id: 'steppe',
        region: 2,
        title: '第二阶梯 · 草原与山地商旅',
        shortTitle: '草原与山地商旅',
        motto: '我行走于草浪与山路之间，常在多民族集市中往来。',
        intro: '草原有良马，山地有银饰，牧场有乳制品，但我们仍缺稳定的粮食，也盼着丝绸、瓷器和铁器。为了让马队和市集更加兴旺，我必须把本地特产带向更远的平原与高原。',
        money: 122,
        stamina: 8,
        startGoods: { horse: 1, fur: 2, dairy: 2, silver: 1 }
      },
      {
        id: 'han',
        region: 3,
        title: '第三阶梯 · 汉族商人',
        shortTitle: '汉族商人',
        motto: '我来自农耕沃野，也知道富庶并不意味着样样齐全。',
        intro: '中原有丝绸、瓷器、茶叶、铁器和粮食，却仍缺战马以备交通与边防，缺皮毛以御寒，缺藏药以疗疾。我要让平原的器物走向高原与草原，也把远方的珍品带回城镇与乡里。',
        money: 128,
        stamina: 8,
        startGoods: { silk: 2, porcelain: 1, tea: 2, iron: 2, grain: 3 }
      }
    ];

    const CHAPTERS = [
      {
        id: 1,
        emoji: '🧭',
        title: '第一章：走出家乡',
        desc: '先跨出熟悉的阶梯，亲眼看见别处的缺与需，才会明白交换为何不可避免。',
        reward: { money: 28, integration: 14, grain: 2, stamina: 0 }
      },
      {
        id: 2,
        emoji: '⚖️',
        title: '第二章：互市成局',
        desc: '零散买卖不足以支撑长久来往。只有稳定的订单与往返，才会让不同区域真正互相依赖。',
        reward: { money: 32, integration: 16, grain: 2, stamina: 0 }
      },
      {
        id: 3,
        emoji: '🍶',
        title: '第三章：同路共饮',
        desc: '当你在三个阶梯都留下交流的痕迹，道路便不再只是货路，也开始成为文化交流之路。',
        reward: { money: 36, integration: 18, grain: 3, stamina: 0 }
      },
      {
        id: 4,
        emoji: '🏮',
        title: '第四章：共同体之路',
        desc: '此时你已经看见差异、经营互市、听见彼此的故事。现在，要把一切推向真正的认同：让交融度达到 90。',
        reward: { money: 0, integration: 0, grain: 0, stamina: 0 }
      }
    ];

    const state = {
      role: null,
      homeRegion: null,
      currentRegion: null,
      money: 0,
      integration: 0,
      stamina: 0,
      maxStamina: 10,
      maxDays: 60,
      daysRemaining: 60,
      inventory: {},
      logs: [],
      visitedRegions: new Set(),
      cultureCount: {1:0,2:0,3:0},
      eventSeen: {},
      currentEvent: null,
      endingShown: false,
      failureShown: false,
      orders: [],
      chapter: 1,
      stats: {
        trades: 0,
        sales: 0,
        culture: 0,
        events: 0,
        rests: 0,
        ordersCompleted: 0,
        effectiveTrades: 0,
        foreignCulture: 0
      }
    };

    const ui = {
      activeTab: 'market',
      cultureChoices: []
    };

    const startScreen = document.getElementById('startScreen');
    const gameScreen = document.getElementById('gameScreen');
    const subtitle = document.getElementById('subtitle');
    const sceneArt = document.getElementById('sceneArt');
    const sceneBody = document.getElementById('sceneBody');
    const metricGrid = document.getElementById('metricGrid');
    const statusStrip = document.getElementById('statusStrip');
    const missionBox = document.getElementById('missionBox');
    const chapterBox = document.getElementById('chapterBox');
    const ordersBox = document.getElementById('ordersBox');
    const actionPanel = document.getElementById('actionPanel');
    const packBox = document.getElementById('packBox');
    const logBox = document.getElementById('logBox');
    const integrationBar = document.getElementById('integrationBar');
    const integrationLabel = document.getElementById('integrationLabel');
    const timeBar = document.getElementById('timeBar');
    const timeLabel = document.getElementById('timeLabel');
    const eventModal = document.getElementById('eventModal');
    const endingModal = document.getElementById('endingModal');

    const SEASONS = ['春', '夏', '秋', '冬'];
    const SAVE_KEY = 'camelCaravanSaveV2';

    function resetState() {
      state.role = null;
      state.homeRegion = null;
      state.currentRegion = null;
      state.money = 0;
      state.integration = 0;
      state.stamina = 0;
      state.maxStamina = 10;
      state.maxDays = 60;
      state.daysRemaining = 60;
      state.inventory = {};
      state.logs = [];
      state.visitedRegions = new Set();
      state.cultureCount = {1:0,2:0,3:0};
      state.eventSeen = {};
      state.currentEvent = null;
      state.endingShown = false;
      state.failureShown = false;
      state.orders = [];
      state.chapter = 1;
      state.stats = {
        trades: 0,
        sales: 0,
        culture: 0,
        events: 0,
        rests: 0,
        ordersCompleted: 0,
        effectiveTrades: 0,
        foreignCulture: 0
      };
      ui.activeTab = 'market';
      ui.cultureChoices = [];
    }

    function shortRegion(id){
      return id === 1 ? '一阶' : id === 2 ? '二阶' : '三阶';
    }

    function elapsedDays(){
      return state.maxDays - state.daysRemaining;
    }

    function seasonIndex(){
      return Math.floor(elapsedDays() / 27) % 4;
    }

    function currentSeason(){
      return SEASONS[seasonIndex()];
    }

    function seasonLabel(){
      return `行旅第 ${Math.floor(elapsedDays() / 27) + 1} 季 · ${currentSeason()}`;
    }

    function stableRand(seed){
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function pseudoVariance(regionId, good){
      const cycle = seasonIndex() + 1;
      let rand = Math.floor(stableRand(cycle * 101 + regionId * 17 + good.length * 13 + good.charCodeAt(0)) * 21) - 10;

      if(REGIONS[regionId].localGoods.includes(good)) rand -= 7;
      if(goodMatchesNeed(regionId, good)) rand += 12;

      if(currentSeason() === '冬' && (good === 'fur' || good === 'tea')) rand += 8;
      if(currentSeason() === '秋' && (good === 'grain' || good === 'barley')) rand += 5;
      if(currentSeason() === '春' && good === 'horse') rand += 5;
      return rand;
    }

    function getNeedLabel(regionId){
      if(regionId === 3) return '战马、皮毛、藏药（如藏红花、冬虫夏草）';
      return REGIONS[regionId].needs.map(key => GOODS[key].name).join('、');
    }

    function getLocalLabel(regionId){
      return REGIONS[regionId].localGoods.map(key => GOODS[key].name).join('、');
    }

    function totalOf(good){
      const lots = state.inventory[good] || [];
      return lots.reduce((sum, lot) => sum + lot.qty, 0);
    }

    function totalGoodsCount(){
      return Object.keys(GOODS).reduce((sum, key) => sum + totalOf(key), 0);
    }

    function addItem(good, qty = 1, acquiredAt = state.currentRegion){
      const origin = GOODS[good].origin;
      if(!state.inventory[good]) state.inventory[good] = [];
      const found = state.inventory[good].find(
        lot => lot.origin === origin && lot.acquiredAt === acquiredAt
      );
      if(found) found.qty += qty;
      else state.inventory[good].push({ origin, acquiredAt, qty });
    }

    function removeItem(good, qty = 1){
      const lots = state.inventory[good] || [];
      const removed = [];
      for(const lot of lots){
        while(lot.qty > 0 && qty > 0){
          lot.qty--;
          qty--;
          removed.push({ origin: lot.origin, acquiredAt: lot.acquiredAt });
        }
        if(qty === 0) break;
      }
      state.inventory[good] = lots.filter(lot => lot.qty > 0);
      return removed;
    }

    function lotSummary(good){
      const lots = state.inventory[good] || [];
      return lots.map(lot => `${shortRegion(lot.origin)}产 · ${shortRegion(lot.acquiredAt)}入手 × ${lot.qty}`).join(' / ');
    }

    function goodMatchesNeed(regionId, good){
      if(regionId === 3 && (good === 'saffron' || good === 'cordyceps')) return true;
      return REGIONS[regionId].needs.includes(good);
    }

    function getBuyPrice(regionId, good){
      const base = GOODS[good].base;
      let multiplier = 1.42;
      if(REGIONS[regionId].localGoods.includes(good)) multiplier = 0.72;
      else if(goodMatchesNeed(regionId, good)) multiplier = 1.95;
      return Math.max(6, Math.round(base * multiplier + pseudoVariance(regionId, good)));
    }

    function getSellPrice(regionId, good){
      const base = GOODS[good].base;
      let multiplier = 0.92;
      if(REGIONS[regionId].localGoods.includes(good)) multiplier = 0.56;
      else if(goodMatchesNeed(regionId, good)) multiplier = 1.46;
      return Math.max(5, Math.round(base * multiplier + pseudoVariance(regionId, good)));
    }

    function calcTradeBonus(regionId, good){
      if((good === 'tea' || good === 'iron') && (regionId === 1 || regionId === 2)) return 4;
      if(regionId === 3 && (good === 'horse' || good === 'fur')) return 4;
      if(regionId === 3 && (good === 'saffron' || good === 'cordyceps')) return 5;
      if(regionId === 2 && good === 'grain') return 4;
      if(regionId === 2 && (good === 'silk' || good === 'porcelain')) return 3;
      if(regionId === 1 && good === 'silk') return 4;
      return 2;
    }

    function clampIntegration(){
      state.integration = Math.max(0, Math.min(100, state.integration));
    }

    function changeIntegration(delta){
      state.integration += delta;
      clampIntegration();
    }

    function addLog(text, kind = ''){
      state.logs.unshift({ text, kind });
      if(state.logs.length > 22) state.logs.pop();
    }

    function getRoleById(id){
      return ROLES.find(role => role.id === id);
    }

    function passDays(days, actionName){
      const beforeSeason = seasonIndex();
      state.daysRemaining = Math.max(0, state.daysRemaining - days);
      const afterSeason = seasonIndex();

      if(days > 0){
        addLog(`【时日流转】${actionName}耗去 ${days} 日。`, 'warn');
      }

      if(afterSeason !== beforeSeason){
        addLog(`【时序变化】商路进入${currentSeason()}季，集市行情与路途难易都在悄然变化。`, 'warn');
      }
    }

    function sceneSeasonHint(){
      if(currentSeason() === '春') return '春路初开，马价与运输需求略有上扬。';
      if(currentSeason() === '夏') return '夏季通行较稳，远行更适合筹备大宗贸易。';
      if(currentSeason() === '秋') return '秋收时节，粮货行情更活跃。';
      return '冬风渐紧，皮毛与茶叶更受欢迎，远行更需要提前备好粮食与路费。';
    }

    function getTravelRuleText(){
      return '跨越 1 级阶梯需消耗 5 日时限，并优先消耗 1 份粮食；粮食不足时，每份差额折算为 18 铜币。课堂版已取消体力限制，重点考察路线选择、物产互补和文化交流。';
    }


    function getTravelCost(target){
      const dist = Math.abs(target - state.currentRegion);
      const grainAvailable = totalOf('grain');
      const grainUse = Math.min(grainAvailable, dist);
      const coinUse = (dist - grainUse) * 18;
      return {
        dist,
        grainUse,
        coinUse,
        staminaCost: 0,
        dayCost: dist * 5
      };
    }

    function canTravelTo(target){
      if(target === state.currentRegion) return false;
      const cost = getTravelCost(target);
      return state.money >= cost.coinUse;
    }

    function getRiskState(){
      if(state.daysRemaining <= 12 || (state.money < 18 && totalGoodsCount() <= 2)){
        return {
          level:'high',
          label:'高风险',
          text:'倒计时、路费或货物已经非常紧张。此时更适合优先完成就近订单，避免无效往返。'
        };
      }
      if(state.daysRemaining <= 28 || (state.money < 30 && totalGoodsCount() <= 2)){
        return {
          level:'mid',
          label:'需谨慎',
          text:'资源开始吃紧。长途旅行前，先核对粮食、路费和目标订单。'
        };
      }
      return {
        level:'low',
        label:'状态稳定',
        text:'商队仍有余裕，可以继续围绕主线筹货、旅行与交流。'
      };
    }

    function serializeState(){
      return {
        roleId: state.role?.id || null,
        homeRegion: state.homeRegion,
        currentRegion: state.currentRegion,
        money: state.money,
        integration: state.integration,
        stamina: state.stamina,
        maxStamina: state.maxStamina,
        maxDays: state.maxDays,
        daysRemaining: state.daysRemaining,
        inventory: state.inventory,
        logs: state.logs,
        visitedRegions: Array.from(state.visitedRegions),
        cultureCount: state.cultureCount,
        eventSeen: state.eventSeen,
        endingShown: state.endingShown,
        failureShown: state.failureShown,
        orders: state.orders,
        chapter: state.chapter,
        stats: state.stats,
        ui: {
          activeTab: ui.activeTab,
          cultureChoices: ui.cultureChoices
        }
      };
    }

    function saveGame(){
      if(!state.role) return;
      try{
        localStorage.setItem(SAVE_KEY, JSON.stringify(serializeState()));
      }catch(err){
        console.warn('save failed', err);
      }
    }

    function hasSavedGame(){
      try{
        return !!localStorage.getItem(SAVE_KEY);
      }catch(err){
        return false;
      }
    }

    function clearSavedGame(){
      try{
        localStorage.removeItem(SAVE_KEY);
      }catch(err){
        console.warn('clear save failed', err);
      }
    }

    function loadSavedGame(){
      try{
        const raw = localStorage.getItem(SAVE_KEY);
        if(!raw) return false;
        const data = JSON.parse(raw);
        if(!data?.roleId) return false;

        resetState();
        state.role = getRoleById(data.roleId);
        if(!state.role) return false;
        state.homeRegion = data.homeRegion;
        state.currentRegion = data.currentRegion;
        state.money = data.money;
        state.integration = data.integration;
        state.stamina = data.stamina;
        state.maxStamina = data.maxStamina || 10;
        state.maxDays = data.maxDays || 60;
        state.daysRemaining = data.daysRemaining;
        state.inventory = data.inventory || {};
        state.logs = data.logs || [];

    function currentChapterDef(){

    function chapterObjectives(chapterId){
      if(chapterId === 1){
        return [
          {
            label:'到访任一异地阶梯',
            done: state.visitedRegions.size >= 2,
            progress: `${Math.min(state.visitedRegions.size - 1, 1) < 0 ? 0 : Math.min(state.visitedRegions.size - 1, 1)}/1`
          },
          {
            label:'在异地进行 1 次文化交流',
            done: state.stats.foreignCulture >= 1,
            progress: `${Math.min(state.stats.foreignCulture, 1)}/1`
          },
          {
            label:'完成 1 次有效跨阶梯交易或 1 份订单',
            done: state.stats.effectiveTrades >= 1 || state.stats.ordersCompleted >= 1,
            progress: `${Math.min(state.stats.effectiveTrades + state.stats.ordersCompleted, 1)}/1`
          }
        ];
      }
      if(chapterId === 2){
        return [
          {
            label:'完成 1 份互通订单',
            done: state.stats.ordersCompleted >= 1,
            progress: `${Math.min(state.stats.ordersCompleted, 1)}/2`
          },
          {
            label:'走遍三个阶梯',
            done: state.visitedRegions.size >= 3,
            progress: `${Math.min(state.visitedRegions.size, 3)}/3`
          },
          {
            label:'完成 2 次有效跨阶梯交易',
            done: state.stats.effectiveTrades >= 2,
            progress: `${Math.min(state.stats.effectiveTrades, 2)}/3`
          }
        ];
      }
      if(chapterId === 3){
        return [
          {
            label:'完成 2 份互通订单',
            done: state.stats.ordersCompleted >= 2,
            progress: `${Math.min(state.stats.ordersCompleted, 2)}/3`
          },
          {
            label:'在两个不同阶梯完成交流',
            done: ([1,2,3].filter(id => state.cultureCount[id] > 0).length >= 2),
            progress: `${[1,2,3].filter(id => state.cultureCount[id] > 0).length}/2`
          },
          {
            label:'完成 3 次有效跨阶梯交易',
            done: state.stats.effectiveTrades >= 3,
            progress: `${Math.min(state.stats.effectiveTrades, 3)}/5`
          }
        ];
      }
      return [
        {
          label:'让中华民族交融度达到 90',
          done: state.integration >= 90,
          progress: `${state.integration}/90`
        }
      ];
    }

    function chapterComplete(chapterId){
      return chapterObjectives(chapterId).every(item => item.done);
    }

    function grantChapterReward(reward){
      if(reward.money) state.money += reward.money;
      if(reward.integration) changeIntegration(reward.integration);
      if(reward.grain) addItem('grain', reward.grain, state.currentRegion);
      // 课堂版取消体力限制，章节奖励不再恢复体力。
    }

    function checkChapterProgress(){
      if(state.chapter >= 4) return false;
      if(!chapterComplete(state.chapter)) return false;

      const finished = currentChapterDef();
      grantChapterReward(finished.reward);
      addLog(`【章节完成】${finished.title}达成。你获得奖励：铜币 +${finished.reward.money}，交融度 +${finished.reward.integration}${finished.reward.grain ? `，粮食 +${finished.reward.grain}` : ''}。`, 'bonus');

      state.chapter += 1;
      const nextChapter = currentChapterDef();

      openInfoModal({
        emoji: finished.emoji,
        title: `${finished.title} 完成`,
        body: `${finished.desc}<br/><br/>奖励已发放：铜币 +${finished.reward.money}、交融度 +${finished.reward.integration}${finished.reward.grain ? `、粮食 +${finished.reward.grain}` : ''}。<br/><br/>新的主线开启：<strong>${nextChapter.title}</strong>。${nextChapter.desc}`,
        buttonText: '进入下一章'
      });
      return true;
    }

    function maybeWin(){
      if(state.endingShown || state.failureShown) return true;
      if(state.chapter === 4 && state.integration >= 90){
        state.endingShown = true;
        openEnding();
        return true;
      }
      return false;
    }

    function checkFail(){
      if(state.endingShown || state.failureShown) return true;

      if(state.daysRemaining <= 0 && state.integration < 90){
        state.failureShown = true;
        openFailure('timeout');
        return true;
      }

      if(state.money <= 0 && totalGoodsCount() === 0){
        state.failureShown = true;
        openFailure('bankrupt');
        return true;
      }

      return false;
    }

      clearSavedGame();

    function getMissionText(){
      const home = state.homeRegion;
      const current = state.currentRegion;
      const region = REGIONS[current];

      let base = '';
      if(home === 1){
        base = '寒冬将至，我的族人需要中原的铁器来打造工具，也需要茶叶来熬制酥油茶，还盼着丝绸进入高原。高原的药材与牲畜若想真正改变家乡命运，就必须翻山越岭，换回不可替代的外来之物。';
      }else if(home === 2){
        base = '草原与山地的商队离不开稳定的粮食，也盼望丝绸、瓷器与铁器。我的路不再是一次短促买卖，而是要反复穿行不同阶梯，才能让多民族市场真正繁盛起来。';
      }else{
        base = '平原富庶，却仍缺战马、皮毛与藏药。我若想让城镇与乡里看到外部世界的价值，就必须把器物和粮食送出去，再把草原与高原的稀缺之物带回来。';
      }

      const sellable = Object.keys(GOODS).filter(key => {
        const lots = state.inventory[key] || [];
        return lots.some(lot => lot.acquiredAt !== current && lot.origin !== current) && goodMatchesNeed(current, key);
      });

      let opportunity = '';
      if(sellable.length){
        opportunity = `此刻在 <strong>${region.stair}</strong> 的集市里，<strong>${sellable.map(k => GOODS[k].name).join('、')}</strong> 正好契合当地需求。若能顺带交付订单，交融度会增长得更明显。`;
      }else if(current === state.homeRegion){
        opportunity = `我此刻仍在家乡。家乡紧缺的是：<strong>${getNeedLabel(home)}</strong>。真正艰难的，不是知道缺什么，而是筹够货、粮食与路费，再把路一次次走通。`;
      }else{
        opportunity = `当前驻地最需要的是：<strong>${getNeedLabel(current)}</strong>。把真正所缺的东西跨阶梯运来，才是提高交融度最稳妥的办法。`;
      }

      return `${base}<br/><br/>${opportunity}`;
    }

    function selectRole(roleId){
      clearSavedGame();
      resetState();
      const role = getRoleById(roleId);
      state.role = role;
      state.homeRegion = role.region;
      state.currentRegion = role.region;
      state.money = role.money;
      state.stamina = role.stamina;
      state.orders = createOrders();
      state.visitedRegions.add(role.region);

      Object.entries(role.startGoods).forEach(([good, qty]) => addItem(good, qty, role.region));

      addLog(`【启程】${role.intro}`, 'important');
      addLog(`我作为“${role.shortTitle}”踏上旅途。如今的商路有倒计时、有章节、有失败风险，只有真正走通互通之路，才能看见共同体意识如何生成。`, 'bonus');

      startScreen.classList.add('hidden');

    function renderMission(){
      missionBox.innerHTML = getMissionText();

      const activeOrders = state.orders.filter(o => !o.completed);
      if(!activeOrders.length){
        ordersBox.innerHTML = `<div class="empty">所有互通订单都已完成。此后仍可继续靠关键贸易与文化交流推进主线。</div>`;

    function postAction(trigger, from, to){
      const chapterOpened = checkChapterProgress();
      renderGame();

      if(chapterOpened) return;
      if(maybeWin()) return;
      if(checkFail()) return;
      if(eventModal.classList.contains('hidden')) maybeTriggerEvent(trigger, from, to);
    }

    function buyItem(good){
      const price = getBuyPrice(state.currentRegion, good);
      if(state.money < price){
        addLog(`我看中了${GOODS[good].name}，可惜囊中只有 ${state.money} 铜币，不够支付 ${price} 铜币。`, 'warn');
        renderGame();
        return;
      }

      state.money -= price;
      addItem(good, 1, state.currentRegion);
      state.stats.trades += 1;
      passDays(0, '集市议价');
      addLog(`我在${REGIONS[state.currentRegion].stair}购入 1 件${GOODS[good].name}，花去 ${price} 铜币。`, '');
      postAction('buy', state.currentRegion, state.currentRegion);
    }


    function sellItem(good){
      if(totalOf(good) <= 0){
        addLog(`我的背包里没有${GOODS[good].name}可卖。`, 'warn');
        renderGame();
        return;
      }

      const removed = removeItem(good, 1)[0];
      const price = getSellPrice(state.currentRegion, good);

      state.money += price;
      state.stats.trades += 1;
      state.stats.sales += 1;
      passDays(0, '集市成交');

      let bonus = 0;
      if(removed && removed.origin !== state.currentRegion && removed.acquiredAt !== state.currentRegion && goodMatchesNeed(state.currentRegion, good)){
        bonus = calcTradeBonus(state.currentRegion, good);
        changeIntegration(bonus);
        state.stats.effectiveTrades += 1;

        if(state.currentRegion === 3 && (good === 'saffron' || good === 'cordyceps')){
          addLog(`我把${GOODS[good].name}作为藏药类珍品带到第三阶梯出售。平原对高原药材的需求，清楚地说明了不同区域之间的互补关系。交融度 +${bonus}。`, 'bonus');
        }else{
          addLog(`我把${GOODS[good].name}卖到真正需要它的地方，所得不只是铜币，还有彼此依赖的加深。交融度 +${bonus}。`, 'bonus');
        }
      }else{
        addLog(`我在${REGIONS[state.currentRegion].stair}卖出 1 件${GOODS[good].name}，收入 ${price} 铜币。`, '');
      }

      postAction('market', state.currentRegion, state.currentRegion);
    }


    function travelTo(target){
      if(target === state.currentRegion) return;

      const { dist, grainUse, coinUse, dayCost } = getTravelCost(target);

      if(state.money < coinUse){
        addLog(`路费不够。此次至少还需要 ${coinUse} 铜币，而我只有 ${state.money} 铜币。`, 'warn');
        renderGame();
        return;
      }

      if(grainUse > 0) removeItem('grain', grainUse);
      state.money -= coinUse;

      const from = state.currentRegion;
      const firstVisit = !state.visitedRegions.has(target);
      state.currentRegion = target;
      state.visitedRegions.add(target);

      passDays(dayCost, '翻越阶梯');

      addLog(`我带着商队从${REGIONS[from].stair}出发，跨越 ${dist} 级阶梯，抵达${REGIONS[target].stair}。${grainUse ? `沿途消耗了 ${grainUse} 份粮食，` : ''}${coinUse ? `另付路费 ${coinUse} 铜币，` : ''}新的互通道路又向前延伸了一步。`, 'important');

      if(firstVisit && target !== state.homeRegion){
        changeIntegration(3);
        addLog(`这是我第一次走到${REGIONS[target].title}。仅仅踏出家乡，去看见别人如何生活，本身就是理解彼此的开始。交融度 +3。`, 'bonus');
      }

      postAction('travel', from, target);
    }


    function chooseCulture(index){
      const choice = ui.cultureChoices[index];
      if(!choice) return;

      const meaningful = choice.countsAsCulture !== false;
      if(meaningful){
        state.cultureCount[state.currentRegion] += 1;
        state.stats.culture += 1;
        if(state.currentRegion !== state.homeRegion) state.stats.foreignCulture += 1;
      }
      changeIntegration(choice.integration);
      state.money += choice.money || 0;
      if(choice.gift) addItem(choice.gift, 1, state.currentRegion);

      passDays(choice.days, '停留交往');

      let text = choice.text;
      if(choice.integration) text += ` 交融度 +${choice.integration}`;
      if(choice.money) text += `，铜币 +${choice.money}`;
      if(choice.gift) text += `，并获得 1 件${GOODS[choice.gift].name}`;
      text += '。';

      if(!meaningful) text += ' 这次停留未计入“有效交流”进度。';
      addLog(text, choice.integration >= 4 ? 'bonus' : '');
      postAction('culture', state.currentRegion, state.currentRegion);
    }


    function restCamp(type){
      if(type === 'small'){
        if(state.money < 8){
          addLog('路线复盘需要花费 8 铜币，如今盘缠不足。', 'warn');
          renderGame();
          return;
        }
        state.money -= 8;
        addItem('grain', 1, state.currentRegion);
        changeIntegration(1);
        state.stats.rests += 1;
        passDays(3, '路线复盘');
        addLog('我和同伴复盘下一站路线，补充 1 份粮食，也更清楚哪里需要什么、我们能带去什么。资金 -8，交融度 +1。', 'important');
      }else{
        if(state.money < 18){
          addLog('组织互市筹备会需要 18 铜币，而我的盘缠还不够。', 'warn');
          renderGame();
          return;
        }
        state.money -= 18;
        addItem('grain', 2, state.currentRegion);
        changeIntegration(2);
        state.stats.rests += 1;
        passDays(5, '互市筹备');
        addLog('我邀请向导、商旅和本地长者一起商议互市路线，补充 2 份粮食。稳定往来需要组织和信任，交融度 +2。资金 -18。', 'important');
      }
      postAction('rest', state.currentRegion, state.currentRegion);
    }


    function submitOrder(orderId){
      const order = state.orders.find(o => o.id === orderId);
      if(!order || order.completed) return;

      if(order.region !== state.currentRegion){
        addLog('这份订单必须在指定阶梯交付。', 'warn');
        renderGame();
        return;
      }

      for(const [good, qty] of Object.entries(order.needs)){
        if(totalOf(good) < qty){
          addLog(`要完成“${order.title}”，我还缺少 ${GOODS[good].name}。`, 'warn');
          renderGame();
          return;
        }
      }

      for(const [good, qty] of Object.entries(order.needs)) removeItem(good, qty);

      state.money += order.rewardMoney;
      changeIntegration(order.rewardIntegration);
      state.stats.ordersCompleted += 1;
      order.completed = true;

      passDays(1, '交付订单');
      addLog(`【完成订单】${order.title}。这不再只是一次零散买卖，而是一条更稳固的互通之路。铜币 +${order.rewardMoney}，交融度 +${order.rewardIntegration}。`, 'bonus');

      postAction('order', state.currentRegion, state.currentRegion);
    }


    function getEventPool(trigger, from, to){
      const current = state.currentRegion;
      const pool = [];

      if((trigger === 'travel' && ((from === 1 && to === 3) || (from === 3 && to === 1))) || current === 1 || current === 3){
        pool.push({
          id: 'teaHorse',
          emoji: '🫖🐎',
          title: '茶马古道开启',
          desc: '山路上的马帮与背夫把茶叶、战马、药材和手工器物带过关山。沿线的人们正在商量：该如何让互市更稳当、更长久？',
          choices: [
            { label:'加入守信互市', result:'我主张按约称量、守信交易。道路因此更可靠，来往的人也越来越多。', integration:8, money:8 },
            { label:'只求一时高价', result:'我把注意力全放在短期利润上，确实赚得快，却失了长远口碑。', integration:1, money:12 }
          ]
        });
      }

      if(current === 1 || current === 3){
        pool.push({
          id: 'princess',
          emoji: '👑📜',
          title: '文成公主进藏',
          desc: '和亲与往来使节带去新的工艺、医药、礼仪与见闻。人们议论：道路所连接的，究竟只是货物，还是更广阔的文化世界？',
          choices: [
            { label:'学习并传播新工艺', result:'我把沿途见闻讲给更多同行听，明白了交流不只改变市场，也改变生活方式。', integration:9, money:4, gift:'silk' },
            { label:'只把它当作谈资', result:'我听过故事便散去，没有真正把新知转化为行动。', integration:2, money:0 }
          ]
        });
      }

      if(trigger === 'travel' || current === 2 || current === 3){
        pool.push({
          id: 'yuchang',
          emoji: '🏮⚖️',
          title: '榷场互市',
          desc: '定期互市让草原、平原与高原的商队有了更稳定的见面之所。守秩序的人越多，来往越频繁，彼此依赖也越深。',
          choices: [
            { label:'遵守契约与尺度', result:'我按公道定价，也鼓励他人照章行事。更多商队因此愿意再来。', integration:7, money:9 },
            { label:'趁机囤货抬价', result:'我赚到了一笔快钱，但市场的信任也被消耗了。', integration:1, money:12 }
          ]
        });
      }

      if(current === 2 || from === 2 || to === 2){
        pool.push({
          id: 'steppeTrade',
          emoji: '🐴🧭',
          title: '草原与山地商路',
          desc: '良马与皮毛向外流动，粮食、铁器、瓷器与丝绸向内进入。多民族商旅在这里相遇，商路也因此不断扩展。',
          choices: [
            { label:'以马换铁，以皮毛换粮', result:'我主动撮合互补交易，大家都看见了不同地区之间不可替代的价值。', integration:8, money:8, gift:'horse' },
            { label:'只挑最便宜的货走', result:'我完成了买卖，却没有真正扩大交流的深度。', integration:1, money:6 }
          ]
        });
      }

      if(trigger === 'rest'){
        pool.push({
          id:'campTalk',
          emoji:'🔥🗺️',
          title:'夜宿营地',
          desc:'夜里围火而坐，不同来路的人谈起祖辈的道路、婚姻与市集。有人说，货路久了，亲缘和习俗也会跟着走动。',
          choices:[
            { label:'认真聆听并记录', result:'我把不同人的故事记在心里，也明白共同体意识往往在漫长的往来中生长。', integration:6, money:0 },
            { label:'早点休息，不再多问', result:'我养足了精神，却没有多了解几分彼此的过去。', integration:1, money:0 }
          ]
        });
      }

      return pool;
    }

    function maybeTriggerEvent(trigger, from, to){
      const chance = trigger === 'travel' ? 0.55 : trigger === 'rest' ? 0.25 : trigger === 'buy' ? 0.06 : trigger === 'market' ? 0.12 : 0.18;
      if(Math.random() > chance) return;

      const pool = getEventPool(trigger, from, to);
      if(!pool.length) return;

      const minSeen = Math.min(...pool.map(evt => state.eventSeen[evt.id] || 0));
      const candidates = pool.filter(evt => (state.eventSeen[evt.id] || 0) === minSeen);
      const event = candidates[Math.floor(Math.random() * candidates.length)];
      openEvent(event);
    }

    function openEvent(event){
      state.currentEvent = event;
      eventModal.classList.remove('hidden');
      eventModal.innerHTML = `
        <div class="modal-card">
          <div class="modal-head">
            <div class="modal-emoji">${event.emoji}</div>
            <div>
              <h2>${event.title}</h2>
              <p>${event.desc}</p>
            </div>
          </div>
          ${dialogueHtml([
            {
              side:'left',
              avatar:'narrator',
              name:'沿途见闻',
              text:event.desc
            }
          ])}
          <div class="choice-list">
            ${event.choices.map((choice, index) => `
              <button class="btn-choice" data-event-choice="${index}">
                <strong>${choice.label}</strong>
                <span class="muted small">${choice.result}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function chooseEvent(index){
      const event = state.currentEvent;
      if(!event) return;
      const choice = event.choices[index];
      if(!choice) return;

      state.eventSeen[event.id] = (state.eventSeen[event.id] || 0) + 1;
      state.stats.events += 1;
      changeIntegration(choice.integration || 0);
      state.money += choice.money || 0;
      if(choice.gift) addItem(choice.gift, 1, state.currentRegion);

      let text = `【${event.title}】${choice.result}`;
      if(choice.integration) text += ` 交融度 +${choice.integration}`;
      if(choice.money) text += `，铜币 +${choice.money}`;
      if(choice.gift) text += `，获得 1 件${GOODS[choice.gift].name}`;
      text += '。';

      addLog(text, choice.integration >= 7 ? 'bonus' : 'important');
      state.currentEvent = null;
      closeNarrativeModal();
      renderGame();
      if(maybeWin()) return;
      checkFail();
    }

    function restartGame(){
      clearSavedGame();
      resetState();
      closeNarrativeModal();
      endingModal.classList.add('hidden');
      endingModal.innerHTML = '';
      gameScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      renderStart();
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if(!btn) return;

      if(btn.dataset.role){
        selectRole(btn.dataset.role);
        return;
      }

      if(btn.dataset.continue){
        loadSavedGame();
        return;
      }

      if(btn.id === 'restartBtn' || btn.dataset.restart){
        restartGame();
        return;
      }

      if(btn.dataset.closeModal){
        closeNarrativeModal();
        if(maybeWin()) return;
        checkFail();
        return;
      }

      if(btn.dataset.tab){
        ui.activeTab = btn.dataset.tab;
        renderGame();
        return;
      }

      if(btn.dataset.buy){
        buyItem(btn.dataset.buy);
        return;
      }

      if(btn.dataset.sell){
        sellItem(btn.dataset.sell);
        return;
      }

      if(btn.dataset.travel){
        travelTo(Number(btn.dataset.travel));
        return;
      }

      if(btn.dataset.culture){
        chooseCulture(Number(btn.dataset.culture));
        return;
      }

      if(btn.dataset.rest){
        restCamp(btn.dataset.rest);
        return;
      }

      if(btn.dataset.submitOrder){
        submitOrder(btn.dataset.submitOrder);
        return;
      }

      if(btn.dataset.eventChoice){
        chooseEvent(Number(btn.dataset.eventChoice));
        return;
      }
    });

    renderStart();
  </script>
</body>
</html>
